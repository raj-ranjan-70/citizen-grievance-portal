spring.application.name=citizen-grievance-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/citizen_grievance_db?createDatabaseIfNotExist=true&useSSL=false\
  &allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom Session Configuration for Manual Authentication
session.timeout=30m
session.absolute-timeout=24h
session.max-concurrent=5
session.cleanup-interval=0 */10 * * * *
session.cookie.name=JSESSIONID
session.cookie.max-age=86400
session.cookie.same-site=Lax
session.cookie.secure=false
session.cookie.domain=
session.cookie.path=/

# Cloudflare R2 / AWS S3 Configuration
cloudflare.r2.endpoint=PLACEHOLDER
cloudflare.r2.access-key-id=PLACEHOLDER
cloudflare.r2.secret-access-key=PLACEHOLDER
cloudflare.r2.bucket-name=PLACEHOLDER
cloudflare.r2.token-value=PLACEHOLDER

# The public URL prefix for the React frontend to load the images
# e.g., https://pub-xxxxxx.r2.dev/ or your custom domain
cloudflare.r2.public-url=PLACEHOLDER